[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mmrag"
version = "0.1.0"
description = "Multimodal visual RAG: measurable page retrieval, evidence selection, grounded VLM generation, and evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Adebanji Adelowo" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rank-bm25>=0.2.2",
    "psutil>=5.9",
    "pyarrow>=15.0",
    "huggingface-hub>=0.25",
    "pytesseract>=0.3.10",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
# Neural models: text/visual encoders, reranker, vision-language generators.
models = [
    "torch>=2.4",
    "transformers>=4.57",
    "sentence-transformers>=3.0",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
# Late-interaction visual document retrievers (ColPali family).
late = ["colpali-engine>=0.3.10"]
# 4-bit quantisation, CUDA only (Kaggle T4).
quant = ["bitsandbytes>=0.44"]
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "streamlit>=1.38",
    "httpx>=0.27",
]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
mmrag = "mmrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mmrag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs downloaded neural models (deselected in CI)"]
addopts = "-q -m 'not models'"
