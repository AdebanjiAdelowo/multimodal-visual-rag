# Multimodal hybrid + cross-encoder reranking of the top 20.
name: hybrid_text_colsmol_rerank
retriever:
  type: hybrid
  fusion: rrf
  components:
    - {type: bm25, text_source: ocr_tesseract}
    - {type: dense_text, text_source: ocr_tesseract}
    - {type: late_interaction, model: vidore/colSmol-256M}
rerank: {type: cross_encoder, model: cross-encoder/ms-marco-MiniLM-L6-v2, text_source: ocr_tesseract, top_n: 20}
