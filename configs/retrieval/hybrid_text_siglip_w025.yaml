# Weighted fusion ablation: the SigLIP component is down-weighted to 0.25.
name: hybrid_text_siglip_w025
retriever:
  type: hybrid
  fusion: rrf
  components:
    - {type: bm25, text_source: ocr_tesseract}
    - {type: dense_text, text_source: ocr_tesseract}
    - {type: visual, model: google/siglip2-base-patch16-224, weight: 0.25}
